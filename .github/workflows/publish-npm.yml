name: Publish npm
run-name: Publish npm ${{ github.event.release.tag_name }}

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ${{ github.event.release.tag_name }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm 11.13.0
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci
      - name: Verify release ${{ github.event.release.tag_name }}
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_TAG#v}"

          if [ "$release_version" != "$package_version" ]; then
            echo "Release version ($release_version) does not match package.json version ($package_version)."
            exit 1
          fi

          if [[ "$package_version" == *-* && "$RELEASE_IS_PRERELEASE" != "true" ]]; then
            echo "Prerelease package versions require a GitHub prerelease."
            exit 1
          fi

          if [[ "$package_version" != *-* && "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            echo "Stable package versions require a stable GitHub release."
            exit 1
          fi
      - name: Publish ${{ github.event.release.tag_name }} to npm
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi
